<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>Pipisa Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{  
      --bg:#0d0d1a;--bg2:#13132a;--bg3:#1a1a35;--card:#1e1e3f;
      --border:#2e2e5e;--acc:#7c5cfc;--acc2:#a78bfa;
      --green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;
      --text:#e8e8ff;--text2:#8888bb;--r:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,'Segoe UI',sans-serif;overflow:hidden}
    #app{display:flex;flex-direction:column;height:100vh}

    /* HEADER */
    #hdr{background:linear-gradient(135deg,#1a0a3e,#0d0d1a);
      border-bottom:1px solid var(--border);padding:12px 16px;
      display:flex;align-items:center;gap:10px;flex-shrink:0}
    #hdr .logo{font-size:26px}
    #hdr h1{font-size:17px;font-weight:700;color:var(--acc2)}
    #hdr .sub{font-size:11px;color:var(--text2);margin-top:1px}
    #hdr .adm-badge{margin-left:auto;background:var(--acc);border-radius:8px;
      padding:3px 10px;font-size:11px;font-weight:700}

    /* NAV */
    #nav{display:flex;overflow-x:auto;gap:5px;padding:9px 12px;
      background:var(--bg2);border-bottom:1px solid var(--border);
      flex-shrink:0;scrollbar-width:none}
    #nav::-webkit-scrollbar{display:none}
    .nb{flex-shrink:0;padding:6px 13px;border-radius:18px;border:1px solid var(--border);
      background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;
      transition:all .2s;white-space:nowrap}
    .nb.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
    .nb:hover:not(.on){border-color:var(--acc2);color:var(--acc2)}

    /* CONTENT */
    #content{flex:1;overflow-y:auto;padding:14px}
    #content::-webkit-scrollbar{width:3px}
    #content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

    /* SAVE BAR */
    #savebar{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);
      padding:11px 14px;display:none}
    #savebar.vis{display:block}

    /* CARDS */
    .sec{margin-bottom:18px}
    .sec-title{font-size:11px;font-weight:700;color:var(--text2);
      text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px;padding-left:3px}
    .card{background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);padding:13px;margin-bottom:10px}

    /* STATS */
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .sc{background:var(--bg3);border:1px solid var(--border);border-radius:12px;
      padding:13px;text-align:center}
    .sc .i{font-size:22px;margin-bottom:3px}
    .sc .v{font-size:20px;font-weight:800;color:var(--acc2)}
    .sc .l{font-size:10px;color:var(--text2);margin-top:2px}

    /* SETTING ROW */
    .sr{display:flex;align-items:center;justify-content:space-between;
      padding:9px 0;border-bottom:1px solid var(--border)}
    .sr:last-child{border-bottom:none}
    .sl{font-size:13px;color:var(--text);flex:1;padding-right:10px;line-height:1.3}
    .si{background:var(--bg);border:1px solid var(--border);color:var(--text);
      border-radius:8px;padding:5px 9px;font-size:13px;width:86px;text-align:right;
      transition:border-color .2s}
    .si:focus{outline:none;border-color:var(--acc)}

    /* TOGGLE */
    .tr{display:flex;align-items:center;justify-content:space-between;
      padding:9px 0;border-bottom:1px solid var(--border)}
    .tr:last-child{border-bottom:none}
    .tl{font-size:13px;color:var(--text)}
    .tog{position:relative;width:42px;height:23px;cursor:pointer}
    .tog input{opacity:0;width:0;height:0}
    .tslider{position:absolute;inset:0;background:var(--bg3);
      border:1px solid var(--border);border-radius:23px;transition:.3s}
    .tslider:before{content:'';position:absolute;height:15px;width:15px;
      left:3px;bottom:3px;background:var(--text2);border-radius:50%;transition:.3s}
    input:checked+.tslider{background:var(--acc);border-color:var(--acc)}
    input:checked+.tslider:before{transform:translateX(19px);background:#fff}

    /* PLAYER */
    .pr{display:flex;align-items:center;gap:9px;padding:10px 0;
      border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
    .pr:last-child{border-bottom:none}
    .pr:hover{background:rgba(124,92,252,.07);border-radius:8px;padding-left:6px}
    .pav{width:35px;height:35px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--acc),var(--acc2));
      display:flex;align-items:center;justify-content:center;font-size:15px}
    .pname{font-size:13px;font-weight:600}
    .pinfo{font-size:11px;color:var(--text2);margin-top:1px}
    .psz{margin-left:auto;font-size:15px;font-weight:700;color:var(--acc2)}

    /* PROMO */
    .pmr{display:flex;align-items:center;justify-content:space-between;
      padding:9px 11px;background:var(--bg3);border-radius:10px;
      margin-bottom:7px;border:1px solid var(--border)}
    .pmc{font-family:monospace;font-size:15px;font-weight:700;color:var(--acc2)}
    .pmi{font-size:11px;color:var(--text2);margin-top:1px}
    .ba{background:rgba(34,197,94,.15);color:var(--green);border-radius:5px;
      padding:1px 7px;font-size:10px;font-weight:700}
    .bi{background:rgba(239,68,68,.15);color:var(--red);border-radius:5px;
      padding:1px 7px;font-size:10px;font-weight:700}

    /* BUTTONS */
    .btn{padding:9px 16px;border-radius:10px;border:none;font-size:13px;
      font-weight:600;cursor:pointer;transition:all .2s;
      display:inline-flex;align-items:center;gap:5px;justify-content:center}
    .btn-p{background:var(--acc);color:#fff}
    .btn-p:hover{background:var(--acc2)}
    .btn-d{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red)}
    .btn-s{background:rgba(34,197,94,.15);color:var(--green);border:1px solid var(--green)}
    .btn-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
    .btn-sm{padding:5px 11px;font-size:11px;border-radius:7px}
    .btn-fw{width:100%;margin-top:8px}
    .btn-o{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid var(--orange)}

    /* MODAL */
    .mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
      z-index:300;align-items:flex-end;justify-content:center}
    .mo.open{display:flex}
    .mb{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;
      width:100%;max-width:480px;border:1px solid var(--border);border-bottom:none;
      animation:up .22s ease;max-height:80vh;overflow-y:auto}
    @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .mt{font-size:17px;font-weight:700;margin-bottom:15px}
    .mf{margin-bottom:11px}
    .mf label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
    .mf input,.mf textarea,.mf select{
      width:100%;background:var(--bg3);border:1px solid var(--border);
      color:var(--text);border-radius:10px;padding:9px 13px;font-size:13px}
    .mf input:focus,.mf textarea:focus{outline:none;border-color:var(--acc)}
    .mf textarea{min-height:70px;resize:vertical}
    .ma{display:flex;gap:9px;margin-top:15px}
    .ma .btn{flex:1}

    /* TOAST */
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
      padding:9px 20px;border-radius:18px;font-size:13px;font-weight:600;
      opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
      white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
    #toast.ok{background:var(--acc);color:#fff}
    #toast.er{background:var(--red);color:#fff}
    #toast.sh{opacity:1}

    /* LOADER */
    .ld{display:flex;align-items:center;justify-content:center;
      padding:40px;color:var(--text2);flex-direction:column;gap:11px}
    .sp{width:32px;height:32px;border:3px solid var(--border);
      border-top-color:var(--acc);border-radius:50%;
      animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* NEWS */
    .ni{padding:8px 11px;border-left:3px solid var(--acc);
      background:var(--bg3);border-radius:0 8px 8px 0;margin-bottom:7px;font-size:12px}
    .nt{font-size:10px;color:var(--text2);margin-top:2px}

    /* SEARCH */
    .srch{width:100%;background:var(--bg3);border:1px solid var(--border);
      color:var(--text);border-radius:10px;padding:9px 13px;font-size:13px;
      margin-bottom:11px}
    .srch:focus{outline:none;border-color:var(--acc)}

    /* DIVIDER */
    .div{height:1px;background:var(--border);margin:10px 0}

    /* RANK BADGE */
    .rnk{font-size:16px;width:28px;text-align:center;flex-shrink:0}

    /* DANGER CARD */
    .dc{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3);
      border-radius:var(--r);padding:13px;margin-bottom:10px}
    .dc-title{font-size:13px;font-weight:700;color:var(--red);margin-bottom:4px}
    .dc-desc{font-size:11px;color:var(--text2);margin-bottom:10px}
  </style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="logo">🍆</div>
    <div><h1>Pipisa Admin</h1><div class="sub">Панель управления</div></div>
    <div class="adm-badge" id="adm-badge">⏳</div>
  </div>
  <div id="denied" style="display:none;flex-direction:column;align-items:center;
    justify-content:center;height:80vh;gap:14px;text-align:center;padding:24px">
    <div style="font-size:60px">🚫</div>
    <h2 style="color:var(--red);font-size:20px">Доступ запрещён</h2>
    <p style="color:var(--text2);font-size:13px;max-width:260px">
      Эта панель доступна только администратору бота.
    </p>
  </div>
  <div id="main" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <div id="nav">
      <button class="nb on"  onclick="tab('dash')">📊 Дашборд</button>
      <button class="nb"     onclick="tab('players')">👥 Игроки</button>
      <button class="nb"     onclick="tab('promos')">🎟 Промо</button>
      <button class="nb"     onclick="tab('settings')">⚙️ /dick</button>
      <button class="nb"     onclick="tab('casino_tab')">🎰 Казино</button>
      <button class="nb"     onclick="tab('economy')">💰 Экономика</button>
      <button class="nb"     onclick="tab('toggles')">🔧 Функции</button>
      <button class="nb"     onclick="tab('events_tab')">🌍 События</button>
      <button class="nb"     onclick="tab('bank_tab')">🏦 Банк</button>
      <button class="nb"     onclick="tab('danger')">⚠️ Опасно</button>
    </div>
    <div id="content"></div>
    <div id="savebar"><button class="btn btn-p btn-fw" onclick="saveAll()">💾 Сохранить все изменения</button></div>
  </div>
</div>
<div class="mo" id="modal" onclick="if(event.target.id==='modal')closeMo()">
  <div class="mb" id="mobody"></div>
</div>
<div id="toast"></div>

<script>
// ─────────────────────────────────────────────────────
// CONFIG — замени URL на твой сервер
// ─────────────────────────────────────────────────────
const ADMIN_ID  = 5368770030;
// Если бот запущен на сервере с публичным IP:
// const API = "http://ТВО_IP:8080";
// Для локальной разработки: API = "http://localhost:8080"
const API = 'http://10.191.124.17:8080';

const tg   = window.Telegram?.WebApp;
let uid    = null;
let isAdm  = false;
let dirty  = {};       // pending setting changes
let S      = {};       // loaded settings cache
let PLAYERS = [];      // loaded players

// ─────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────
function init() {
  if (tg) {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#0d0d1a');
    tg.setBackgroundColor('#0d0d1a');
    const u = tg.initDataUnsafe?.user;
    if (u) { uid = u.id; isAdm = u.id === ADMIN_ID; }
  } else {
    // Browser dev mode
    uid = ADMIN_ID; isAdm = true;
  }
  if (!isAdm) {
    document.getElementById('denied').style.display = 'flex';
    document.getElementById('adm-badge').textContent = '🚫';
    return;
  }
  document.getElementById('adm-badge').textContent = '✅ Админ';
  document.getElementById('main').style.display = 'flex';
  tab('dash');
}

// ─────────────────────────────────────────────────────
// API
// ─────────────────────────────────────────────────────
async function req(path, method='GET', body=null) {
  const headers = {
    'Content-Type': 'application/json',
    'X-Telegram-Init-Data': tg?.initData || '',
    'X-Dev-Admin': API === '' ? 'false' : 'true',
  };
  try {
    const r = await fetch(API + path, {
      method, headers,
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    // If API not configured, return demo data
    return demoData(path, body);
  }
}

function demoData(path, body) {
  // Minimal demo so UI works without backend
  if (path==='/stats') return {ok:true,data:{chats:3,players:12,active_promos:2,total_deposited:85000,total_loans:4,total_coins_in_game:234000,secret_members:1,lottery_pot:1500,biggest_size:264}};
  if (path==='/news')  return {ok:true,data:[{text:'🎰 @hlopchik выиграл джекпот!',created_at:new Date().toISOString()},{text:'☄️ Метеорит упал в чате!',created_at:new Date(Date.now()-3600000).toISOString()}]};
  if (path==='/settings') return {ok:true,data:{dick_min_cm:'-5',dick_max_cm:'10',dick_cooldown_hours:'24',coins_per_dick:'5',coins_per_positive:'10',casino_min_bet:'10',casino_max_bet:'500',casino_win_chance:'45',casino_jackpot_chance:'5',casino_jackpot_multiplier:'10',duel_default_stake:'5',duel_max_stake:'50',rare_nuclear_chance:'1',rare_nuclear_cm:'50',rare_mars_chance:'2',rare_mars_cm:'30',rare_shark_chance:'2',rare_shark_cm:'20',rare_alien_chance:'1',daily_coins_min:'20',daily_coins_max:'50',daily_cm_chance:'30',price_pet_cat:'200',price_pet_dragon:'500',bank_deposit_regular_rate:'1',bank_loan_max:'100000',event_interval_hours:'4',meteor_interval_hours:'6',lottery_ticket_min:'10',container_common_price:'50',secret_entry_cost:'50000',project_goal_coins:'1000000',experiment_cost_coins:'100',smuggle_success_chance:'50'}};
  if (path==='/toggles') return {ok:true,data:{casino_enabled:'1',shop_enabled:'1',duel_enabled:'1',clans_enabled:'1',quests_enabled:'1',achievements_enabled:'1',daily_enabled:'1',rare_events_enabled:'1',mutation_enabled:'1',rob_enabled:'1',spy_enabled:'1',boss_enabled:'1',dungeon_enabled:'1',space_enabled:'1',politics_enabled:'1',alchemy_enabled:'1',minigame_enabled:'1',event_enabled:'1',bank_enabled:'1',lottery_enabled:'1',container_enabled:'1',puzzle_enabled:'1',meteor_enabled:'1',auction_enabled:'1',experiment_enabled:'1',smuggle_enabled:'1',project_enabled:'1',secret_enabled:'1',news_enabled:'1'}};
  if (path==='/players') return {ok:true,data:[{user_id:111,username:'hlopchik',first_name:'Хлопчик',size:264,coins:15200,luck:75,chat_id:-100123,cooldown_hours:24,casino_plays:45,duel_wins:12},{user_id:222,username:'matvey',first_name:'Матвей',size:198,coins:8400,luck:60,chat_id:-100123,cooldown_hours:24,casino_plays:22,duel_wins:5},{user_id:333,username:'hlopchik',first_name:'Родион',size:156,coins:22000,luck:50,chat_id:-100123,cooldown_hours:24,casino_plays:89,duel_wins:3}]};
  if (path==='/promos')  return {ok:true,data:[{code:'SUMMER25',cm:15,max_uses:100,used_count:47,is_active:1,created_at:'2025-06-01T10:00:00'},{code:'VIPCODE',cm:50,max_uses:10,used_count:10,is_active:0,created_at:'2025-05-15T14:00:00'}]};
  if (path==='/bank/stats') return {ok:true,data:{loans:8,total_borrowed:450000,biggest:100000,paid:3,total_deposited:85000,active_loans:5,total_shares:42}};
  if (path==='/leaderboard') return {ok:true,data:[{user_id:111,username:'hlopchik',best_size:264,total_coins:15200},{user_id:222,username:'matvey',best_size:198,total_coins:8400}]};
  return {ok:true,data:{}};
}

// ─────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────
const TABS = ['dash','players','promos','settings','casino_tab','economy','toggles','events_tab','bank_tab','danger'];
function tab(t) {
  TABS.forEach((n,i)=>{document.querySelectorAll('.nb')[i]?.classList.toggle('on',n===t)});
  dirty = {};
  document.getElementById('savebar').classList.remove('vis');
  const c = document.getElementById('content');
  c.innerHTML = '<div class="ld"><div class="sp"></div><span>Загрузка...</span></div>';
  setTimeout(()=>render(t), 120);
}
async function render(t) {
  const c = document.getElementById('content');
  if      (t==='dash')       c.innerHTML = await buildDash();
  else if (t==='players')    { c.innerHTML = await buildPlayers(); }
  else if (t==='promos')     c.innerHTML = await buildPromos();
  else if (t==='settings')   { c.innerHTML = await buildSettings(); showSave(); }
  else if (t==='casino_tab') { c.innerHTML = await buildCasino(); showSave(); }
  else if (t==='economy')    { c.innerHTML = await buildEconomy(); showSave(); }
  else if (t==='toggles')    c.innerHTML = await buildToggles();
  else if (t==='events_tab') { c.innerHTML = await buildEvents(); showSave(); }
  else if (t==='bank_tab')   { c.innerHTML = await buildBank(); showSave(); }
  else if (t==='danger')     c.innerHTML = buildDanger();
}
function showSave(){ document.getElementById('savebar').classList.add('vis'); }

// ─────────────────────────────────────────────────────
// DASHBOARD
// ─────────────────────────────────────────────────────
async function buildDash() {
  const [sr, nr, lr] = await Promise.all([req('/stats'), req('/news'), req('/leaderboard')]);
  const s = sr.data; const news = nr.data; const lb = lr.data;

  const newsHtml = news.slice(0,6).map(n=>`
    <div class="ni">${n.text}
      <div class="nt">${new Date(n.created_at).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') || '<div style="color:var(--text2);text-align:center;padding:16px;font-size:13px">Новостей пока нет</div>';

  const medals = ['🥇','🥈','🥉'];
  const lbHtml = lb.slice(0,5).map((p,i)=>`
    <div class="pr" style="cursor:default">
      <div class="rnk">${medals[i]||i+1+'.'}</div>
      <div class="pav">🍆</div>
      <div><div class="pname">${p.username?'@'+p.username:p.first_name||'Игрок'}</div>
        <div class="pinfo">💰 ${(p.total_coins||0).toLocaleString()} 🪙</div></div>
      <div class="psz">${p.best_size} см</div>
    </div>`).join('');

  const apiStatus = API ? `<span style="color:var(--green)">✅ ${API}</span>` : `<span style="color:var(--yellow)">⚠️ Demo режим — задай API URL в коде</span>`;

  return `
  <div class="sec">
    <div class="sec-title">📊 Статистика сервера</div>
    <div class="sg">
      <div class="sc"><div class="i">💬</div><div class="v">${s.chats}</div><div class="l">Чатов</div></div>
      <div class="sc"><div class="i">👥</div><div class="v">${s.players}</div><div class="l">Игроков</div></div>
      <div class="sc"><div class="i">🪙</div><div class="v">${((s.total_coins_in_game||0)/1000).toFixed(0)}K</div><div class="l">Монет в игре</div></div>
      <div class="sc"><div class="i">🏦</div><div class="v">${((s.total_deposited||0)/1000).toFixed(0)}K</div><div class="l">Во вкладах</div></div>
      <div class="sc"><div class="i">🎟</div><div class="v">${s.active_promos||0}</div><div class="l">Активных промо</div></div>
      <div class="sc"><div class="i">🌑</div><div class="v">${s.secret_members||0}</div><div class="l">В тайном об-ве</div></div>
      <div class="sc"><div class="i">🎫</div><div class="v">${((s.lottery_pot||0)/1000).toFixed(1)}K</div><div class="l">Лотерейный фонд</div></div>
      <div class="sc"><div class="i">📏</div><div class="v">${s.biggest_size||0}</div><div class="l">Рекорд (см)</div></div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-title">🏆 Топ игроков</div>
    <div class="card">${lbHtml||'<div style="color:var(--text2);text-align:center;padding:14px;font-size:13px">Нет данных</div>'}</div>
  </div>
  <div class="sec">
    <div class="sec-title">📰 Последние новости</div>
    <div class="card">${newsHtml}</div>
  </div>
  <div class="sec">
    <div class="sec-title">🔌 API статус</div>
    <div class="card" style="font-size:12px">${apiStatus}</div>
  </div>`;
}

// ─────────────────────────────────────────────────────
// PLAYERS
// ─────────────────────────────────────────────────────
async function buildPlayers() {
  const { data } = await req('/players');
  PLAYERS = data;
  const rows = data.map((p,i) => {
    const name = p.username ? `@${p.username}` : (p.first_name||'Игрок');
    return `<div class="pr" onclick="editPlayer(${i})">
      <div class="rnk">${i+1}</div>
      <div class="pav">🍆</div>
      <div style="flex:1;min-width:0">
        <div class="pname">${name}</div>
        <div class="pinfo">💰 ${(p.coins||0).toLocaleString()} • 🍀 ${p.luck||50}% • 🎰 ${p.casino_plays||0} игр</div>
      </div>
      <div class="psz">${p.size} см</div>
    </div>`;
  }).join('');
  return `
  <div class="sec">
    <div class="sec-title">👥 Все игроки (${data.length})</div>
    <input class="srch" placeholder="🔍 Поиск по имени..." oninput="filterP(this.value)"/>
    <div class="card" id="plist">${rows||'<div style="color:var(--text2);text-align:center;padding:16px">Игроков нет</div>'}</div>
  </div>`;
}

function filterP(q) {
  document.querySelectorAll('#plist .pr').forEach(r=>{
    r.style.display = r.querySelector('.pname').textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function editPlayer(i) {
  const p = PLAYERS[i];
  const name = p.username ? `@${p.username}` : (p.first_name||'Игрок');
  document.getElementById('mobody').innerHTML = `
    <div class="mt">👤 ${name}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px">
      <div class="sc"><div class="i">📏</div><div class="v">${p.size}</div><div class="l">см</div></div>
      <div class="sc"><div class="i">💰</div><div class="v">${(p.coins||0).toLocaleString()}</div><div class="l">монет</div></div>
    </div>
    <div class="mf"><label>📏 Размер (см)</label><input type="number" id="ep-size" value="${p.size}"/></div>
    <div class="mf"><label>💰 Монеты</label><input type="number" id="ep-coins" value="${p.coins||0}"/></div>
    <div class="mf"><label>🍀 Удача (0–100)</label><input type="number" id="ep-luck" value="${p.luck||50}" min="0" max="100"/></div>
    <div class="mf"><label>⏱ КД (ч, 0 = сбросить сейчас)</label><input type="number" id="ep-cd" value="${p.cooldown_hours||24}"/></div>
    <div class="ma">
      <button class="btn btn-p" onclick="saveP(${i})">💾 Сохранить</button>
      <button class="btn btn-d" onclick="resetP(${i})">🔄 Сброс</button>
    </div>
    <button class="btn btn-g btn-fw" onclick="closeMo()" style="margin-top:8px">Закрыть</button>`;
  openMo();
}

async function saveP(i) {
  const p = PLAYERS[i];
  const body = {
    chat_id:       p.chat_id,
    size:          +document.getElementById('ep-size').value,
    coins:         +document.getElementById('ep-coins').value,
    luck:          +document.getElementById('ep-luck').value,
    cooldown_hours:+document.getElementById('ep-cd').value,
  };
  const r = await req(`/player/${p.user_id}/update`, 'POST', body);
  if (r.ok) { closeMo(); toast('✅ Сохранено!','ok'); tab('players'); }
  else toast('❌ Ошибка','er');
}

async function resetP(i) {
  if (!confirm('Сбросить игрока до нуля?')) return;
  const p = PLAYERS[i];
  const r = await req(`/player/${p.user_id}/reset`, 'POST', {chat_id: p.chat_id});
  if (r.ok) { closeMo(); toast('🔄 Сброшен!','ok'); tab('players'); }
  else toast('❌ Ошибка','er');
}

async function buildPromos() {
  const { data } = await req('/promos');
  const rows = data.map(p=>`
    <div class="pmr">
      <div>
        <div class="pmc">${p.code}</div>
        <div class="pmi">${p.cm>0?'+':''}${p.cm} см • ${p.used_count}/${p.max_uses} • ${new Date(p.created_at).toLocaleDateString('ru')}</div>
      </div>
      <div style="display:flex;align-items:center;gap:7px">
        <span class="${p.is_active?'ba':'bi'}">${p.is_active?'Акт.':'Откл.'}</span>
        <button class="btn btn-g btn-sm" onclick="togglePromo('${p.code}')">⚡</button>
        <button class="btn btn-d btn-sm" onclick="delPromo('${p.code}')">🗑</button>
      </div>
    </div>`).join('');
  return `
  <div class="sec">
    <div class="sec-title">🎟 Промокоды (${data.length})</div>
    <button class="btn btn-p btn-fw" onclick="newPromoMo()" style="margin-bottom:12px">➕ Создать промокод</button>
    ${rows||'<div class="card" style="color:var(--text2);text-align:center;padding:16px">Промокодов нет</div>'}
  </div>`;
}

function newPromoMo() {
  document.getElementById('mobody').innerHTML = `
    <div class="mt">➕ Новый промокод</div>
    <div class="mf"><label>Код (пусто = случайный)</label>
      <input type="text" id="nc-code" placeholder="SUMMER25" style="text-transform:uppercase"
        oninput="this.value=this.value.toUpperCase()"/></div>
    <div class="mf"><label>Сантиметры (отрицательное = штраф)</label>
      <input type="number" id="nc-cm" value="10"/></div>
    <div class="mf"><label>Количество активаций</label>
      <input type="number" id="nc-uses" value="100" min="1"/></div>
    <div class="ma">
      <button class="btn btn-p" onclick="createPromo()">✅ Создать</button>
      <button class="btn btn-g" onclick="closeMo()">Отмена</button>
    </div>`;
  openMo();
}

async function createPromo() {
  const code  = document.getElementById('nc-code').value.trim().toUpperCase();
  const cm    = +document.getElementById('nc-cm').value;
  const uses  = +document.getElementById('nc-uses').value;
  const r = await req('/promos/create', 'POST', {code, cm, max_uses: uses});
  if (r.ok) { closeMo(); toast(`✅ Промокод ${r.data?.code||code} создан!`,'ok'); tab('promos'); }
  else toast('❌ Ошибка','er');
}

async function togglePromo(code) {
  const r = await req(`/promos/toggle/${code}`, 'POST');
  if (r.ok) { toast('⚡ Статус изменён!','ok'); tab('promos'); }
}

async function delPromo(code) {
  if (!confirm(`Удалить промокод ${code}?`)) return;
  const r = await req(`/promos/delete/${code}`, 'POST');
  if (r.ok) { toast('🗑 Удалён!','ok'); tab('promos'); }
}

async function togChanged(key, val) {
  const r = await req('/toggles/save','POST',{[key]: val?'1':'0'});
  toast(r.ok ? (val?'✅ Включено':'❌ Выключено') : '❌ Ошибка', r.ok?'ok':'er');
}

    <div class="dc">
      <div class="dc-title">☄️ Уронить метеорит</div>
      <div class="dc-desc">Метеорит упадёт во всех активных чатах прямо сейчас</div>
      <button class="btn btn-d btn-fw" onclick="doMeteor()">☄️ Уронить метеорит</button>
    </div>
    <div class="dc">
      <div class="dc-title">🎫 Провести розыгрыш лотереи</div>
      <div class="dc-desc">Форс-розыгрыш во всех чатах где куплены билеты. Победитель получает приз.</div>
      <button class="btn btn-d btn-fw" onclick="doLottery()">🎫 Провести розыгрыш</button>
    </div>
    <div class="dc">
      <div class="dc-title">👥 Дать монеты всем игрокам</div>
      <div class="dc-desc">Начислить одинаковое количество монет всем игрокам во всех чатах</div>
      <input type="number" id="give-coins" value="100" style="width:100%;background:var(--bg);
        border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 13px;
        font-size:13px;margin-bottom:8px"/>
      <button class="btn btn-s btn-fw" onclick="doGiveCoins()">💰 Дать монеты всем</button>
    </div>
    <div class="dc">
      <div class="dc-title">📏 Дать см всем игрокам</div>
      <div class="dc-desc">Добавить сантиметры всем игрокам во всех чатах</div>
      <input type="number" id="give-cm" value="5" style="width:100%;background:var(--bg);
        border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 13px;
        font-size:13px;margin-bottom:8px"/>
      <button class="btn btn-s btn-fw" onclick="doGiveCm()">📏 Добавить см всем</button>
    </div>
  </div>`;
}

async function doBroadcast() {
  const text = document.getElementById('bc-text').value.trim();
  if (!text) { toast('Введи текст!','er'); return; }
  if (!confirm(`Отправить объявление во все чаты?\n\n"${text.slice(0,50)}..."`)) return;
  const r = await req('/broadcast','POST',{text});
  toast(r.ok ? `📢 Отправлено в ${r.data?.sent||'?'} чатов!` : '❌ Ошибка', r.ok?'ok':'er');
}

async function doEvent() {
  if (!confirm('Запустить случайное мировое событие во всех чатах?')) return;
  const r = await req('/events/trigger','POST');
  toast(r.ok ? `🌍 ${r.data?.event||'Событие'} запущено!` : '❌ Ошибка', r.ok?'ok':'er');
}

async function doMeteor() {
  if (!confirm('Уронить метеорит во всех чатах?')) return;
  const r = await req('/meteor/spawn','POST');
  toast(r.ok ? `☄️ Метеорит упал в ${r.data?.chats||'?'} чатах!` : '❌ Ошибка', r.ok?'ok':'er');
}

async function doLottery() {
  if (!confirm('Провести розыгрыш лотереи во всех чатах?')) return;
  const r = await req('/lottery/draw','POST');
  if (r.ok && r.data?.length) {
    toast(`🎫 Розыгрыш в ${r.data.length} чатах!`,'ok');
  } else if (r.ok) {
    toast('🎫 Нет активных лотерей','ok');
  } else toast('❌ Ошибка','er');
}

async function doGiveCoins() {
  const amount = +document.getElementById('give-coins').value;
  if (!amount || amount < 1) { toast('Введи сумму!','er'); return; }
  if (!confirm(`Дать ${amount} 🪙 всем игрокам?`)) return;
  // Send broadcast + update all players
  const r = await req('/broadcast','POST',{text: `🎁 Администратор дарит всем ${amount} монет!`, give_coins: amount});
  toast(r.ok ? `💰 +${amount} 🪙 всем игрокам!` : '❌ Ошибка', r.ok?'ok':'er');
}

async function doGiveCm() {
  const amount = +document.getElementById('give-cm').value;
  if (!amount || amount < 1) { toast('Введи количество!','er'); return; }
  if (!confirm(`Добавить ${amount} см всем игрокам?`)) return;
  const r = await req('/broadcast','POST',{text: `📏 Администратор добавляет всем +${amount} см!`, give_cm: amount});
  toast(r.ok ? `📏 +${amount} см всем!` : '❌ Ошибка', r.ok?'ok':'er');
}

// ─────────────────────────────────────────────────────
// SETTING HELPERS
// ─────────────────────────────────────────────────────
function sr(key, label) {
  const val = S[key] ?? '';
  return `<div class="sr">
    <span class="sl">${label}</span>
    <input class="si" type="number" value="${val}"
      oninput="dirty['${key}']=this.value" onchange="dirty['${key}']=this.value"/>
  </div>`;
}

function changed(key, val) { dirty[key] = val; }

async function saveAll() {
  if (!Object.keys(dirty).length) { toast('Нет изменений','ok'); return; }
  const r = await req('/settings/save','POST', dirty);
  if (r.ok) { dirty = {}; toast(`✅ Сохранено ${r.data?.saved||''} настроек!`,'ok'); }
  else toast('❌ Ошибка сохранения','er');
}

// ─────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────
function openMo()  { document.getElementById('modal').classList.add('open'); }
function closeMo() { document.getElementById('modal').classList.remove('open'); }

// ─────────────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────────────
let _tt;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `${type} sh`;
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('sh'), 2500);
}

// ─────────────────────────────────────────────────────
// START
// ─────────────────────────────────────────────────────
init();
</script>
</body>
</html>
